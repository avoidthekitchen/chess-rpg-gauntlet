<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15121a" />
    <title>3D Model Comparison</title>
    <style>
      :root {
        --bg: #15121a;
        --ink: #f0e7d4;
        --muted: #b3a88f;
        --gold: #e0ab45;
        --line: #3d3446;
        --surface: rgba(33, 28, 39, 0.88);
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #scene {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #scene canvas {
        display: block;
      }
      .hud {
        position: fixed;
        left: 0;
        right: 0;
        padding: 12px 16px;
        pointer-events: none;
      }
      .hud.top {
        top: 0;
        padding-top: max(12px, env(safe-area-inset-top));
      }
      .hud.bottom {
        bottom: 0;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
      h1 {
        margin: 0;
        font: 600 20px/1.2 'Iowan Old Style', Palatino, Georgia, serif;
      }
      .sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #labels span {
        position: absolute;
        transform: translate(-50%, 0);
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 8px;
      }
      #labels span small {
        font-weight: 400;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 760px;
        margin: 0 auto;
      }
      button {
        pointer-events: auto;
        font: inherit;
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: var(--gold);
        color: var(--gold);
      }
      button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div class="hud top">
      <h1>3D model comparison</h1>
      <p class="sub">Same figurine art, three image-to-3D services · drag to orbit, pinch or scroll to zoom</p>
    </div>
    <div class="hud bottom">
      <div class="controls" id="controls"></div>
    </div>
    <script type="module" src="/src/mockups/modelViewer.ts"></script>
  </body>
</html>
