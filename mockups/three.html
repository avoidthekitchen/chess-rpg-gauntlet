<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15121a" />
    <title>3D Board Mockup</title>
    <style>
      :root {
        --bg: #15121a;
        --ink: #f0e7d4;
        --muted: #b3a88f;
        --gold: #e0ab45;
        --line: #3d3446;
        --surface: rgba(33, 28, 39, 0.88);
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #scene canvas {
        display: block;
      }
      .hud {
        position: fixed;
        left: 0;
        right: 0;
        padding: 12px 16px;
        pointer-events: none;
      }
      .hud.top {
        top: 0;
        padding-top: max(12px, env(safe-area-inset-top));
      }
      .hud.bottom {
        bottom: 0;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
      h1 {
        margin: 0;
        font: 600 20px/1.2 'Iowan Old Style', Palatino, Georgia, serif;
      }
      .sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 720px;
        margin: 0 auto;
      }
      button {
        pointer-events: auto;
        font: inherit;
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 14px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--gold);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #1d1505;
        font-weight: 600;
      }
      button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <div class="hud top">
      <h1>3D board mockup</h1>
      <p class="sub">Three.js · two pieces each side · tap a button to play a capture</p>
    </div>
    <div class="hud bottom">
      <div class="controls">
        <button class="primary" data-action="knight">Frog knight captures</button>
        <button class="primary" data-action="rook">Tortoise rook captures</button>
        <button data-action="style" aria-pressed="false">Style: 3D toys</button>
        <button data-action="slowmo" aria-pressed="false">Slow motion: off</button>
        <button data-action="reset">Reset</button>
      </div>
    </div>
    <script type="module" src="/src/mockups/threeMockup.ts"></script>
  </body>
</html>
